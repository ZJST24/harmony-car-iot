<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<style>
  :root{
    --ink:#1f2933; --muted:#5b6b7a; --line:#e4e9ef; --bg:#f7f9fb; --card:#ffffff;

  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.7;
       font-family:"Microsoft YaHei","PingFang SC",system-ui,-apple-system,sans-serif}
  header{padding:20px 24px 0}
  h1{font-size:20px;margin:0 0 4px;letter-spacing:.3px}
  .sub{color:var(--muted);font-size:12.5px}
  .layout{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:16px;padding:16px 24px 30px;align-items:start}
  .stage{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px}
  svg{width:100%;height:auto;display:block}
  aside{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;
        position:sticky;top:16px;max-height:calc(100vh - 40px);overflow:auto}
  @media(max-width:1020px){ .layout{grid-template-columns:1fr} aside{position:static;max-height:none} }

  /* ---------- 图 ---------- */
  .node{cursor:pointer}
  .node .box{fill:#fff;stroke:#dbe4ef;stroke-width:1.5;transition:stroke .15s}
  .node:hover .box{stroke:#9dbfe8}
  .node.sel .box{stroke:#1554c0;stroke-width:2.6}
  .node .t{font-size:15px;font-weight:700;fill:#1f2933}
  .node .s{font-size:11px;fill:#5b6b7a}
  .node .m{font-size:10.5px;fill:#8593a3}
  .node .ico{font-size:19px}
  .edge-line{fill:none;stroke-width:2.4;stroke-linecap:round;transition:stroke-width .15s,opacity .15s}
  .edge-line.sel{stroke-width:4.2}
  .edge-hit{fill:none;stroke:transparent;stroke-width:24;cursor:pointer}
  .elabel{font-size:11px;fill:#5b6b7a;pointer-events:none;
          paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
  .legend{font-size:11px;fill:#8593a3}
  .edges.has-sel .edge-line:not(.sel){opacity:.35}
  .nodes.has-sel .node:not(.sel){opacity:.45}
  .stage-hint{text-align:center;color:var(--muted);font-size:11.5px;padding:2px 0 8px}

  /* ---------- 面板 ---------- */
  aside h2{font-size:16.5px;margin:0 0 6px;line-height:1.4}
  aside h3{font-size:12.5px;color:var(--muted);letter-spacing:1px;margin:18px 0 6px;
           font-weight:600;text-transform:none}
  aside p{margin:6px 0}
  .lead{color:#3d4c5c;font-size:13px}
  .tags{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 2px}
  .tag{font-size:11px;padding:1px 9px;border-radius:20px;background:#eef2f7;color:#4a5b6c;border:1px solid #e0e7ef}
  .tag.b{background:var(--blue-bg);color:var(--blue);border-color:#cfe0f8}
  .tag.g{background:#e8f6ef;color:var(--green);border-color:#bfe5d2}
  .tag.a{background:var(--amber-bg);color:var(--amber);border-color:#f0dcae}
  aside ul{margin:6px 0;padding-left:20px}
  aside li{margin:3px 0;font-size:13px}
  .iface{border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin:8px 0;background:#fbfcfe}
  .iface .row{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
  .iface .path{font-family:Consolas,"Courier New",monospace;font-size:12.5px;font-weight:600}
  .iface .d{color:var(--muted);font-size:12px;margin-top:2px}
  .mth{display:inline-block;font-size:10px;font-weight:700;padding:1px 7px;border-radius:5px;letter-spacing:.5px}
  .get{background:#e8f0fd;color:#1554c0}
  .post{background:#e6f6ee;color:#0e7a4a}
  .mqtt{background:#fdf0df;color:#9a6210}
  .api{background:#eae7fb;color:#4b3fb0}
  pre{background:#0f1a2a;color:#dce6f2;padding:10px 12px;border-radius:8px;font-size:11.5px;
      line-height:1.55;overflow:auto;margin:8px 0}
  code{font-family:Consolas,"Courier New",monospace;background:#eef2f7;padding:1px 5px;
       border-radius:4px;font-size:12px;color:#b3261e}
  .note{background:var(--amber-bg);border:1px solid #f0dcae;border-radius:8px;
        padding:8px 12px;font-size:12.5px;color:#7a5200;margin:10px 0}
  .tip{background:#eaf6ef;border:1px solid #bfe5d2;border-radius:8px;
       padding:8px 12px;font-size:12.5px;color:#0e6b45;margin:10px 0}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin:6px 0}
  .chips button{font:inherit;font-size:12px;padding:4px 11px;border-radius:20px;cursor:pointer;
    border:1px solid #d9e3ee;background:#fff;color:#3d4c5c}
  .chips button:hover{border-color:#9dbfe8;background:#f4f9ff}
  .kv{font-size:12.5px;color:#3d4c5c}
  .kv b{display:inline-block;min-width:64px;margin-right:8px;color:var(--muted);font-weight:600}
  footer{color:var(--muted);font-size:11.5px;text-align:center;padding:0 24px 26px}
</style>
</head>

<header>

</header>

<div class="layout">

        <g class="node" data-id="backend">
          <rect class="box" x="455" y="250" width="250" height="92" rx="14"></rect>
          <rect x="455" y="262" width="3.5" height="68" rx="2" fill="#1554c0"></rect>
          <text class="ico" x="475" y="298">🧩</text>
          <text class="t" x="507" y="288">业务后端 Flask</text>

        </g>

        <!-- ③ IoTDA -->
        <g class="node" data-id="iotda">
          <rect class="box" x="455" y="440" width="250" height="92" rx="14"></rect>
          <rect x="455" y="452" width="3.5" height="68" rx="2" fill="#1f7a5a"></rect>
          <text class="ico" x="475" y="488">☁️</text>
          <text class="t" x="507" y="478">华为云 IoTDA</text>
          <text class="s" x="507" y="498">标准版 S0 · 9f149bee02</text>
          <text class="m" x="507" y="517">设备影子 · 命令下发 · 物模型</text>
        </g>

        <!-- ④ 小车 -->
        <g class="node" data-id="car">
          <rect class="box" x="455" y="630" width="250" height="92" rx="14"></rect>
          <rect x="455" y="642" width="3.5" height="68" rx="2" fill="#b06a12"></rect>
          <text class="ico" x="475" y="678">🚗</text>
          <text class="t" x="507" y="668">模拟小车</text>
          <text class="s" x="507" y="688">MQTT 客户端 · device_id+secret</text>
          <text class="m" x="507" y="707">car_mqtt_client_001.py</text>
        </g>
      </g>

      <!-- 图例 -->
      <text class="legend" x="70" y="772">━━ 蓝 = HTTP/JSON（APP、网页 → 后端）　━━ 绿 = HTTPS OpenAPI（后端 → 云）　━━ 橙 = MQTTS（云 ↔ 小车）</text>
    </svg>
    <div class="stage-hint">连线可点、节点可点；点击空白处回到总览</div>
  </div>

  <aside id="panel"></aside>
</div>

<footer>数据来自 2026-11-07 实测配置 · 配套文档：接口文档.md / 项目交接.md</footer>

    '<button data-go="edge:e3">②↔③ OpenAPI</button>',
    '<button data-go="edge:e4">③↔④ MQTT</button>',

    '<li><b>状态靠影子</b>：设备间歇在线，云端替它记住最后状态，APP 读影子而不是"连设备"。</li>',
    '</ul>',
    '<div class="tip">想快速验收：车端 + 后端各开一个终端，然后 <code>curl http://127.0.0.1:8000/status</code>，能返回坐标就说明 ②③④ 三段都通了。</div>'
  ].join('');

  var DATA = {

    /* ------------------------------------------------------------------ 节点 */

        '<h3>它调用的接口</h3>',

    view: {

  var panel = document.getElementById('panel');
  var svg = document.querySelector('svg');
  var edgesG = document.getElementById('edges');
  var nodesG = document.getElementById('nodes');

  function clearSel() {
    var i;
    var ns = nodesG.querySelectorAll('.node');
    for (i = 0; i < ns.length; i++) { ns[i].classList.remove('sel'); }
    var es = edgesG.querySelectorAll('.edge-line');
    for (i = 0; i < es.length; i++) { es[i].classList.remove('sel'); }
    nodesG.classList.remove('has-sel');
    edgesG.classList.remove('has-sel');
  }

  function showOverview() {
    clearSel();
    panel.innerHTML = OVERVIEW;
    panel.scrollTop = 0;
  }

  function showNode(id) {
    var d = DATA[id];
    if (!d) { return; }
    clearSel();
    nodesG.classList.add('has-sel');
    var g = nodesG.querySelector('.node[data-id="' + id + '"]');
    if (g) { g.classList.add('sel'); }
    panel.innerHTML = '<h2>' + d.title + '</h2><div class="tags">' + d.tags.join('') + '</div>' + d.body;
    panel.scrollTop = 0;
  }

  function showEdge(id) {
    var d = DATA[id];
    if (!d) { return; }
    clearSel();
    edgesG.classList.add('has-sel');
    var line = edgesG.querySelector('.edge-line[data-id="' + id + '"]');
    if (line) { line.classList.add('sel'); }
    panel.innerHTML = '<h2>' + d.title + '</h2><div class="tags">' + d.tags.join('') + '</div>' + d.body;
    panel.scrollTop = 0;
  }

  var ns = nodesG.querySelectorAll('.node');
  for (var i = 0; i < ns.length; i++) {
    (function (g) {
      g.addEventListener('click', function (ev) {
        ev.stopPropagation();
        showNode(g.getAttribute('data-id'));
      });
    })(ns[i]);
  }

  var hs = edgesG.querySelectorAll('.edge-hit');
  for (var j = 0; j < hs.length; j++) {
    (function (p) {
      p.addEventListener('click', function (ev) {
        ev.stopPropagation();
        showEdge(p.getAttribute('data-id'));
      });
    })(hs[j]);
  }

  /* 面板里的快捷按钮 */
  panel.addEventListener('click', function (ev) {
    var t = ev.target;
    if (!t || !t.getAttribute) { return; }
    var go = t.getAttribute('data-go');
    if (!go) { return; }
    var parts = go.split(':');
    if (parts[0] === 'node') { showNode(parts[1]); }
    if (parts[0] === 'edge') { showEdge(parts[1]); }
  });

  /* 点空白回总览 */
  svg.addEventListener('click', function () { showOverview(); });

  showOverview();
})();
